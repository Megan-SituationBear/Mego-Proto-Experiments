<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copado Prototype & Components</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .split-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #e2e8f0;
    }
    .panel:last-child {
      border-right: none;
    }
    .panel-header {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: white;
      padding: 1rem 1.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .panel-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #64748b;
    }
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <div class="split-container">
    
    <!-- Left Panel: Prototype -->
    <div class="panel">
      <div class="panel-header">
        <span>🚀 Full Prototype</span>
        <span class="status-badge">
          <span class="status-dot"></span>
          In Progress
        </span>
      </div>
      <div class="panel-content">
        <div class="loading" id="prototypeLoading">
          <div class="spinner"></div>
          <p>Add your prototype URL...</p>
        </div>
        <!-- Replace the src with your deployed prototype URL -->
        <!-- <iframe id="prototypeFrame" src="YOUR_PROTOTYPE_URL_HERE" onload="document.getElementById('prototypeLoading').style.display='none'"></iframe> -->
      </div>
    </div>

    <!-- Right Panel: Components -->
    <div class="panel">
      <div class="panel-header">
        <span>🎨 Component Demos</span>
        <span class="status-badge">
          <span class="status-dot"></span>
          Live
        </span>
      </div>
      <div class="panel-content">
        <div class="loading" id="componentsLoading">
          <div class="spinner"></div>
          <p>Loading components...</p>
        </div>
        <iframe 
          id="componentsFrame" 
          src="ai-input-interactive-demo.html" 
          onload="document.getElementById('componentsLoading').style.display='none'"
        ></iframe>
      </div>
    </div>

  </div>

</body>
</html>
