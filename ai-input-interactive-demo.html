<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIInput Component - Interactive Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    .conversation-container {
      max-height: 320px;
      overflow-y: auto;
    }
    
    @keyframes slideInFromTop {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .conversation-animate {
      animation: slideInFromTop 0.5s ease-out;
    }
    
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }
    
    .typing-dot {
      animation: bounce 1s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    .context-menu {
      display: none;
    }

    .plus-button-wrapper:hover .context-menu,
    .context-menu:hover {
      display: block;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen py-12 px-6">
  
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-slate-900 mb-2 text-center">AI Input Component</h1>
    <p class="text-slate-600 mb-8 text-center">Click to focus → Type a message → Press Enter → Watch conversation begin</p>
    
    <!-- Interactive Demo Container -->
    <div id="demoContainer" class="w-full">
      <!-- Conversation will appear here when messages exist -->
      <div id="conversationArea"></div>
      
      <!-- AI Input -->
      <div id="aiInputContainer" 
        class="relative bg-white/70 rounded-2xl border-2 border-gray-300 transition-all duration-500 transform hover:shadow-2xl"
        style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);">
        
        <div class="flex flex-col p-3">
          <!-- Textarea -->
          <textarea
            id="aiInput"
            placeholder="Try: @Copado what do you do? Or, @project Let's Go!"
            class="w-full px-4 text-sm bg-transparent outline-none resize-none font-body transition-all duration-500 text-gray-400 placeholder-gray-400"
            style="padding-top: 12px; padding-bottom: 12px; height: 48px; line-height: 1.5; font-family: Inter, system-ui, sans-serif; font-size: 14px;"
            rows="1"
          ></textarea>

          <!-- Action buttons row - below textarea -->
          <div class="flex items-center justify-between mt-3">
            <!-- Left action buttons -->
            <div class="flex items-center gap-2 relative">
              <!-- Plus button with context menu -->
              <div class="relative plus-button-wrapper">
                <button type="button" class="p-2.5 hover:bg-gray-100 rounded-lg transition-colors" title="Add context">
                  <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </button>
                
                <!-- Context Menu -->
                <div class="context-menu absolute left-0 bottom-full mb-2 w-56 bg-white/95 backdrop-blur-md rounded-xl border border-gray-200 shadow-2xl z-50 py-1.5"
                  style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);">
                  <div class="px-3 py-1.5 border-b border-gray-100">
                    <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Conversation Context:</p>
                  </div>
                  <div class="py-0.5">
                    <button class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 transition-colors text-left group">
                      <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                      <span class="text-xs text-gray-700 group-hover:text-blue-600 font-medium">Add Images and Docs</span>
                    </button>
                    <button class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 transition-colors text-left group">
                      <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                      <span class="text-xs text-gray-700 group-hover:text-blue-600 font-medium">Connect Slack Channel</span>
                    </button>
                    <button class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 transition-colors text-left group">
                      <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                      <span class="text-xs text-gray-700 group-hover:text-blue-600 font-medium">Connect Org</span>
                    </button>
                    <button class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 transition-colors text-left group">
                      <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                      <span class="text-xs text-gray-700 group-hover:text-blue-600 font-medium">Connect Jira</span>
                    </button>
                    <button class="w-full px-3 py-2 flex items-center gap-2.5 hover:bg-blue-50 transition-colors text-left group">
                      <svg class="w-4 h-4 text-gray-600 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                      <span class="text-xs text-gray-700 group-hover:text-blue-600 font-medium">All Integrations</span>
                    </button>
                  </div>
                </div>
              </div>

              <button type="button" class="p-2.5 hover:bg-gray-100 rounded-lg transition-colors" title="Settings">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </button>
            </div>

            <!-- Send button -->
            <button 
              id="sendButton"
              type="button"
              class="p-3.5 rounded-xl transition-all duration-200 bg-gray-100 text-gray-400 cursor-not-allowed"
              title="Send message"
              disabled
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('aiInput');
    const inputContainer = document.getElementById('aiInputContainer');
    const sendButton = document.getElementById('sendButton');
    const conversationArea = document.getElementById('conversationArea');
    let isFocused = false;
    let messages = [];
    let isTyping = false;

    // Update input styling based on state
    function updateInputState() {
      if (isFocused && messages.length > 0) {
        // Focused with conversation
        inputContainer.className = 'relative bg-white/95 backdrop-blur-md rounded-2xl border-2 border-blue-500 transition-all duration-500 transform scale-[1.02] shadow-2xl ring-4 ring-blue-100';
        input.style.paddingTop = '20px';
        input.style.paddingBottom = '20px';
        input.style.height = '120px';
      } else if (isFocused) {
        // Just focused
        inputContainer.className = 'relative bg-white/95 backdrop-blur-md rounded-2xl border-2 border-blue-500 transition-all duration-500 transform scale-[1.02] shadow-2xl ring-4 ring-blue-100';
        input.style.paddingTop = '20px';
        input.style.paddingBottom = '20px';
        input.style.height = '120px';
      } else {
        // Default
        inputContainer.className = 'relative bg-white/70 rounded-2xl border-2 border-gray-300 transition-all duration-500 transform hover:shadow-2xl';
        input.style.paddingTop = '12px';
        input.style.paddingBottom = '12px';
        input.style.height = '48px';
      }
    }

    // Update send button state
    function updateSendButton() {
      if (input.value.trim() && !isTyping) {
        sendButton.disabled = false;
        sendButton.className = 'p-3.5 rounded-xl transition-all duration-200 bg-blue-600 text-white hover:bg-blue-700 shadow-lg hover:shadow-xl';
      } else {
        sendButton.disabled = true;
        sendButton.className = 'p-3.5 rounded-xl transition-all duration-200 bg-gray-100 text-gray-400 cursor-not-allowed';
      }
    }

    // Render conversation
    function renderConversation() {
      if (messages.length === 0 && !isTyping) {
        conversationArea.innerHTML = '';
        return;
      }

      let html = `
        <div class="mb-4 space-y-3 max-h-[320px] overflow-y-auto px-3 py-4 rounded-2xl border border-gray-200/50 conversation-animate" 
          style="background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);">
      `;

      messages.forEach(msg => {
        const align = msg.isUser ? 'justify-end' : 'justify-start';
        const bgColor = msg.isUser ? 'bg-blue-600 text-white' : 'bg-white/90 border border-gray-200 text-slate-800 shadow-sm';
        
        html += `
          <div class="flex ${align}">
            <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-left ${bgColor} transition-all duration-500 ease-out">
              <p class="font-body text-sm leading-relaxed" style="font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 24px;">
                ${msg.content}
              </p>
            </div>
          </div>
        `;
      });

      // Typing indicator
      if (isTyping) {
        html += `
          <div class="flex justify-start">
            <div class="bg-white/90 border border-gray-200 shadow-sm px-4 py-2.5 rounded-2xl">
              <div class="flex items-center gap-1">
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></div>
              </div>
            </div>
          </div>
        `;
      }

      html += '</div>';
      conversationArea.innerHTML = html;
    }

    // Send message
    function sendMessage() {
      const text = input.value.trim();
      if (!text || isTyping) return;

      // Add user message
      messages.push({
        id: Date.now().toString(),
        content: text,
        isUser: true
      });

      input.value = '';
      updateSendButton();
      renderConversation();
      updateInputState();

      // Show typing indicator
      isTyping = true;
      renderConversation();

      // Simulate AI response
      setTimeout(() => {
        isTyping = false;
        
        let aiResponse = '';
        if (messages.filter(m => m.isUser).length === 1) {
          // First message: echo back
          aiResponse = `I see you mentioned "${text}". That sounds interesting! Can you tell me more about what you're trying to accomplish?`;
        } else if (messages.filter(m => m.isUser).length === 2) {
          // Second message: creating workspace
          aiResponse = "Perfect! Let me create a workspace for you to dive deeper into this...";
        } else {
          aiResponse = "I understand. Let me help you with that!";
        }

        messages.push({
          id: (Date.now() + 1).toString(),
          content: aiResponse,
          isUser: false
        });

        renderConversation();
        updateInputState();
      }, 1200);
    }

    // Event listeners
    input.addEventListener('focus', () => {
      isFocused = true;
      input.className = 'w-full px-4 text-sm bg-transparent outline-none resize-none font-body transition-all duration-500 text-slate-700 placeholder-gray-500';
      updateInputState();
    });

    input.addEventListener('blur', () => {
      isFocused = false;
      input.className = 'w-full px-4 text-sm bg-transparent outline-none resize-none font-body transition-all duration-500 text-gray-400 placeholder-gray-400';
      updateInputState();
    });

    input.addEventListener('input', () => {
      updateSendButton();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener('click', sendMessage);
  </script>

</body>
</html>
