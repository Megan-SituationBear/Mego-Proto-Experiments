name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - Q4
      - tonight-work
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: new-proto/package-lock.json

      - name: Install dependencies
        working-directory: ./new-proto
        run: npm ci

      - name: Build
        working-directory: ./new-proto
        run: npm run build
        
      - name: Copy files for GitHub Pages
        working-directory: ./new-proto
        run: |
          cp dist/app.html dist/copado-home-page.html
          echo "Copied app.html to copado-home-page.html"
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./new-proto/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
